<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Graph Visualizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
            font-size: 1.1em;
        }

        .upload-section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            border: 2px dashed #667eea;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        input[type="file"],
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="file"]:focus,
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 25px;
        }

        button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .results-section {
            margin-top: 30px;
        }

        .graph-container {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
        }

        #graphVisualization {
            width: 100%;
            height: 600px;
            background: white;
            border-radius: 10px;
            display: none;
        }

        .loading {
            text-align: center;
            padding: 40px;
            display: none;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #fee;
            border: 1px solid #fcc;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        .success {
            background: #efe;
            border: 1px solid #cfc;
            color: #3c3;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        .documents-list {
            margin-top: 30px;
        }

        .document-item {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            transition: border-color 0.3s;
        }

        .document-item:hover {
            border-color: #667eea;
        }

        .document-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .document-meta {
            color: #666;
            font-size: 0.9em;
        }

        .graph-stats {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            display: none;
        }

        .stat-item {
            display: inline-block;
            margin-right: 30px;
        }

        .stat-label {
            color: #666;
            font-size: 0.9em;
        }

        .stat-value {
            color: #667eea;
            font-size: 1.5em;
            font-weight: 600;
        }

        canvas {
            border: 1px solid #e0e0e0;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Knowledge Graph Visualizer</h1>
        <p class="subtitle">Extract and visualize knowledge graphs from PDF documents</p>

        <div class="upload-section">
            <div class="form-group">
                <label for="pdfFile">📄 Select PDF Document:</label>
                <input type="file" id="pdfFile" accept=".pdf">
            </div>
            
            <div class="form-group">
                <label for="docTitle">Document Title:</label>
                <input type="text" id="docTitle" placeholder="Enter document title (optional)">
            </div>
            
            <div class="form-group">
                <label for="themeInput">🎨 Graph Theme (optional):</label>
                <input type="text" id="themeInput" placeholder="e.g., Technology, Science, Business">
            </div>

            <div class="button-group">
                <button onclick="uploadDocument()">Upload Document</button>
                <button onclick="processDocument()" id="processBtn" disabled>Extract Knowledge Graph</button>
            </div>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Processing document and generating knowledge graph...</p>
        </div>

        <div class="error" id="error"></div>
        <div class="success" id="success"></div>

        <div class="results-section">
            <div class="graph-stats" id="graphStats"></div>
            
            <div class="graph-container">
                <h2 style="margin-bottom: 15px;">📈 Knowledge Graph Visualization</h2>
                <canvas id="graphVisualization"></canvas>
            </div>
        </div>

        <div class="documents-list" id="documentsList">
            <h2 style="margin-bottom: 15px;">📚 Recent Documents</h2>
        </div>
    </div>

    <script>
        let currentDocumentId = null;
        let currentGraph = null;

        // Load recent documents on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadDocuments();
        });

        async function uploadDocument() {
            const fileInput = document.getElementById('pdfFile');
            const titleInput = document.getElementById('docTitle');
            const file = fileInput.files[0];

            if (!file) {
                showError('Please select a PDF file');
                return;
            }

            const formData = new FormData();
            formData.append('file', file);
            formData.append('title', titleInput.value || file.name);

            try {
                showLoading(true);
                const response = await fetch('/api/documents/', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error('Upload failed');
                }

                const data = await response.json();
                currentDocumentId = data.id;
                
                showSuccess('Document uploaded successfully! Now click "Extract Knowledge Graph"');
                document.getElementById('processBtn').disabled = false;
                loadDocuments();
            } catch (error) {
                showError('Error uploading document: ' + error.message);
            } finally {
                showLoading(false);
            }
        }

        async function processDocument() {
            if (!currentDocumentId) {
                showError('Please upload a document first');
                return;
            }

            const theme = document.getElementById('themeInput').value;

            try {
                showLoading(true);
                const response = await fetch(`/api/documents/${currentDocumentId}/process/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ theme: theme })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Processing failed');
                }

                const data = await response.json();
                currentGraph = data.graph_data;
                
                showSuccess('Knowledge graph extracted successfully!');
                displayGraph(data.graph_data);
                displayStats(data.graph_data);
                loadDocuments();
            } catch (error) {
                showError('Error processing document: ' + error.message);
            } finally {
                showLoading(false);
            }
        }

        function displayGraph(graphData) {
            const canvas = document.getElementById('graphVisualization');
            const ctx = canvas.getContext('2d');
            
            // Set canvas size
            canvas.width = canvas.offsetWidth;
            canvas.height = 600;
            canvas.style.display = 'block';

            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const nodes = graphData.nodes;
            const edges = graphData.edges;

            if (nodes.length === 0) {
                ctx.font = '20px Arial';
                ctx.fillStyle = '#666';
                ctx.textAlign = 'center';
                ctx.fillText('No nodes to display', canvas.width / 2, canvas.height / 2);
                return;
            }

            // Calculate node positions using force-directed layout simulation
            const positions = calculateNodePositions(nodes, edges, canvas.width, canvas.height);

            // Draw edges first
            ctx.strokeStyle = '#999';
            ctx.lineWidth = 2;
            edges.forEach(edge => {
                const source = positions[edge.source];
                const target = positions[edge.target];
                
                if (source && target) {
                    ctx.beginPath();
                    ctx.moveTo(source.x, source.y);
                    ctx.lineTo(target.x, target.y);
                    ctx.stroke();

                    // Draw arrow
                    drawArrow(ctx, source.x, source.y, target.x, target.y);

                    // Draw edge label
                    const midX = (source.x + target.x) / 2;
                    const midY = (source.y + target.y) / 2;
                    ctx.font = '10px Arial';
                    ctx.fillStyle = '#666';
                    ctx.textAlign = 'center';
                    ctx.fillText(edge.relationship, midX, midY - 5);
                }
            });

            // Draw nodes
            nodes.forEach(node => {
                const pos = positions[node.id];
                if (pos) {
                    // Draw node circle
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, 30, 0, 2 * Math.PI);
                    ctx.fillStyle = '#667eea';
                    ctx.fill();
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 3;
                    ctx.stroke();

                    // Draw node label
                    ctx.font = '12px Arial';
                    ctx.fillStyle = '#fff';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    
                    // Truncate long labels
                    let label = node.label;
                    if (label.length > 10) {
                        label = label.substring(0, 10) + '...';
                    }
                    ctx.fillText(label, pos.x, pos.y);
                }
            });
        }

        function calculateNodePositions(nodes, edges, width, height) {
            const positions = {};
            const padding = 100;
            const usableWidth = width - 2 * padding;
            const usableHeight = height - 2 * padding;

            // Simple circular layout
            const radius = Math.min(usableWidth, usableHeight) / 2;
            const centerX = width / 2;
            const centerY = height / 2;

            nodes.forEach((node, index) => {
                const angle = (2 * Math.PI * index) / nodes.length;
                positions[node.id] = {
                    x: centerX + radius * Math.cos(angle),
                    y: centerY + radius * Math.sin(angle)
                };
            });

            return positions;
        }

        function drawArrow(ctx, fromX, fromY, toX, toY) {
            const headlen = 10;
            const angle = Math.atan2(toY - fromY, toX - fromX);
            
            // Shorten the line to not overlap with node
            const shortenedToX = toX - 30 * Math.cos(angle);
            const shortenedToY = toY - 30 * Math.sin(angle);

            ctx.beginPath();
            ctx.moveTo(shortenedToX, shortenedToY);
            ctx.lineTo(
                shortenedToX - headlen * Math.cos(angle - Math.PI / 6),
                shortenedToY - headlen * Math.sin(angle - Math.PI / 6)
            );
            ctx.moveTo(shortenedToX, shortenedToY);
            ctx.lineTo(
                shortenedToX - headlen * Math.cos(angle + Math.PI / 6),
                shortenedToY - headlen * Math.sin(angle + Math.PI / 6)
            );
            ctx.stroke();
        }

        function displayStats(graphData) {
            const statsDiv = document.getElementById('graphStats');
            statsDiv.innerHTML = `
                <div class="stat-item">
                    <div class="stat-label">Nodes</div>
                    <div class="stat-value">${graphData.metadata.node_count}</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Edges</div>
                    <div class="stat-value">${graphData.metadata.edge_count}</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Connections</div>
                    <div class="stat-value">${graphData.edges.length}</div>
                </div>
            `;
            statsDiv.style.display = 'block';
        }

        async function loadDocuments() {
            try {
                const response = await fetch('/api/documents/');
                const documents = await response.json();

                const listDiv = document.getElementById('documentsList');
                if (documents.length === 0) {
                    listDiv.innerHTML = '<h2>📚 Recent Documents</h2><p style="color: #666;">No documents uploaded yet.</p>';
                    return;
                }

                let html = '<h2 style="margin-bottom: 15px;">📚 Recent Documents</h2>';
                documents.forEach(doc => {
                    html += `
                        <div class="document-item">
                            <div class="document-title">${doc.title}</div>
                            <div class="document-meta">
                                Uploaded: ${new Date(doc.uploaded_at).toLocaleString()} | 
                                Status: ${doc.processed ? '✅ Processed' : '⏳ Pending'}
                            </div>
                        </div>
                    `;
                });
                listDiv.innerHTML = html;
            } catch (error) {
                console.error('Error loading documents:', error);
            }
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            document.getElementById('success').style.display = 'none';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('success');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            document.getElementById('error').style.display = 'none';
            setTimeout(() => {
                successDiv.style.display = 'none';
            }, 5000);
        }
    </script>
</body>
</html>
